name: Fleet Translation Engine

on:
  workflow_dispatch:
    inputs:
      target_language:
        description: 'Target Language Name (e.g. Italian, Indonesian)'
        required: true
        default: 'Italian'
      lang_code:
        description: 'ISO 639-1 Language Code (e.g. it, id, hi)'
        required: true
        default: 'it'
      pot_file:
        description: 'Path to source template POT/PO file in the repository'
        required: true
        default: 'Nimzo_3d_template.pot'

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext

      - name: Install Python Dependencies
        run: |
          pip install polib openai

      - name: Execute Translation Engine
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_API_BASE: 'https://api.cerebras.ai/v1'
          MODEL_NAME: 'llama3.1-8b'
          POT_FILE: ${{ github.event.inputs.pot_file }}
          TARGET_LANGUAGE: ${{ github.event.inputs.target_language }}
          LANG_CODE: ${{ github.event.inputs.lang_code }}
        run: |
          if [[ ! -f "$POT_FILE" ]]; then
            echo "::error::POT template not found: $POT_FILE"
            exit 1
          fi
          OUTPUT_PO="locales/${LANG_CODE}/LC_MESSAGES/nimzo_3d.po"
          python scripts/translate_engine.py \
            --pot "$POT_FILE" \
            --lang "$TARGET_LANGUAGE" \
            --code "$LANG_CODE" \
            --output "$OUTPUT_PO"

      - name: Validate & Compile Binary Catalog (.mo)
        env:
          LANG_CODE: ${{ github.event.inputs.lang_code }}
        run: |
          PO_PATH="locales/${LANG_CODE}/LC_MESSAGES/nimzo_3d.po"
          MO_PATH="locales/${LANG_CODE}/LC_MESSAGES/nimzo_3d.mo"
          echo "Compiling $PO_PATH -> $MO_PATH"
          msgfmt -c -v -o "$MO_PATH" "$PO_PATH"

      - name: Upload Language Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: locale-${{ github.event.inputs.lang_code }}
          path: |
            locales/${{ github.event.inputs.lang_code }}/LC_MESSAGES/*.po
            locales/${{ github.event.inputs.lang_code }}/LC_MESSAGES/*.mo
          if-no-files-found: ignore

      - name: Commit & Push Changes
        env:
          LANG_CODE: ${{ github.event.inputs.lang_code }}
        run: |
          git config user.name "Fleet Translator Bot"
          git config user.email "bot@users.noreply.github.com"
          git add locales/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-translation: add [${LANG_CODE}] catalog" && git push)
